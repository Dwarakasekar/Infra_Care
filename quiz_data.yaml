  pk: 1
  fields:
    name: Sustainability and Biodiversity

- model: sustain.question
  pk: 1
  fields:
    quiz: 1
    text: What is the main goal of sustainable development?

- model: sustain.answer
  pk: 1
  fields:
    question: 1
    text: To meet the needs of the present without compromising the ability of future generations to meet their own needs.
    is_correct: true

- model: sustain.answer
  pk: 2
  fields:
    question: 1
    text: To maximize economic growth at any environmental cost.
    is_correct: false

- model: sustain.answer
  pk: 3
  fields:
    question: 1
    text: To promote industrialization and urbanization without considering environmental impacts.
    is_correct: false

- model: sustain.answer
  pk: 4
  fields:
    question: 1
    text: To focus solely on reducing poverty and inequality.
    is_correct: false

- model: sustain.question
  pk: 2
  fields:
    quiz: 1
    text: What is biodiversity?

- model: sustain.answer
  pk: 5
