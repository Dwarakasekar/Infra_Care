<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/org.css' %}">
    <script defer src="{% static 'js/script.js' %}"></script>
    <title>Org</title>
</head>
<body>
    <nav>
        <ul class="menu">
            <li class="logo">
                <a href="#"><img src="{% static 'imgs/logo3.png' %}" alt="Infra-care Logo" style="height: 40px;"></a>
            </li>
            <li class="item"><a href="/Home">Home</a></li>
            <li class="item"><a href="/About">About us</a></li>
            <li class="item"><a href="">Blogs</a></li>
            <li class="item">
                <select name="Services" onchange="window.location.href=this.value;">
                    <option value="" disabled selected>Select Service</option>
                    <option value="{% url 'client' %}">Client</option>
                    <option value="{% url 'org' %}">Org</option>
                </select>                
            </li>
            <li class="item"><a href="">Crew</a></li>
            <li class="item button"><a href="">Log In</a></li>
            <li class="toggle" id="menu-toggle">
                <span class="bars"></span>
            </li>
        </ul>
    </nav>

    <section class="hero">
        <img src="{% static 'imgs/service_eg.jpg' %}" alt="Green Building">
        <div class="hero-text">OUR WORK</div>
    </section>

    <section class="features">
        <h2>OUR FEATURES & SERVICES FOR ORGANISATION</h2>
        <div class="features-grid">
            <!-- <div class="feature-box">
                <a href="{% url 'cp' %}" class="feature-btn">
                    <img src="{% static 'imgs/cp_org.png' %}" alt="Create Project">
                    <p>Create Project</p>
                </a>
            </div> -->
            <div class="feature-box">
                <a href="{% url 'cp' %}"> <!-- Updated button link -->
                    <button class="feature-btn">
                        <img src="{% static 'imgs/cp_org.png' %}" alt="Create Project">
                        <p>Create Project</p>
                    </button>
                </a>
            </div>
            
            <div class="feature-box">
                <a href="{% url 'track_project' %}">
                    <button class="feature-btn">
                        <img src="{% static 'imgs/ong_org.png' %}" alt="Ongoing Project">
                        <p>WIP</p>
                    </button>
                </a>
            </div>
            

            <div class="feature-box">
              <a href="{% url 'advisor_home' %}">
                <button class="feature-btn" type="button">
                <img src="{% static 'imgs/ar_org.png' %}" alt="Advisor Icon">
                <p>Advisor</p>
                </button>
               </a>
            </div>

            <div class="feature-box">
                <a href="{% url 'cc' %}">
                    <button class="feature-btn">
                        <img src="{% static 'imgs/client.webp' %}" alt="Client Connectivity">
                        <p>Client Connect</p>
                    </button>
                </a>
            </div>
            
            <div class="feature-box">
                <a href="{% url 'disaster_toolkit' %}">
                <button class="feature-btn">
                    <img src="{% static 'imgs/blog_org.png' %}" alt="Create Blogs">
                    <p>Resilience</p>
                </button>
                </a>
            </div>
            <div class="feature-box">
                <a href="{% url 'weather' %}">
                    <button class="feature-btn">
                        <img src="{% static 'imgs/weather_org.jpg' %}" alt="Predict Climate for Project">
                        <p>Forecast</p>
                    </button>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
